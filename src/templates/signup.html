{% extends "base.html" %}

{% block title %}Sign Up - ShortURL{% endblock %}

{% block content %}
<section class="py-24">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-zinc-900/50 backdrop-blur-sm border border-zinc-800 rounded-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-heading font-bold mb-2">Create Account</h1>
                <p class="text-text-muted">Sign up to manage and track your URLs</p>
            </div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-zinc-400 mb-2">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-indigo-500 text-white rounded-lg py-3 px-4 outline-none transition-all"
                        required
                        data-testid="signup-email-input"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-zinc-400 mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-indigo-500 text-white rounded-lg py-3 px-4 outline-none transition-all"
                        required
                        minlength="6"
                        data-testid="signup-password-input"
                    />
                    <p class="text-xs text-zinc-500 mt-1">Minimum 6 characters</p>
                </div>

                <button
                    type="submit"
                    class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 px-6 rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(99,102,241,0.3)] hover:shadow-[0_0_30px_rgba(99,102,241,0.5)]"
                    data-testid="signup-submit-button"
                >
                    Sign Up
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-zinc-400">
                    Already have an account?
                    <a href="/api/login" class="text-primary hover:underline" data-testid="login-link-from-signup">Log in</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
    }
    
    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ email, password })
        });
        
        if (!response.ok) {
            const error = await response.json();
            showToast(error.detail || 'Signup failed', 'error');
            return;
        }
        
        showToast('Account created successfully!', 'success');
        setTimeout(() => {
            window.location.href = '/api/dashboard';
        }, 500);
    } catch (error) {
        console.error('Error:', error);
        showToast('Signup failed', 'error');
    }
});
</script>
{% endblock %}
