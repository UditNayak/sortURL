{% extends "base.html" %}

{% block title %}Login - ShortURL{% endblock %}

{% block content %}
<section class="py-24">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-zinc-900/50 backdrop-blur-sm border border-zinc-800 rounded-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-heading font-bold mb-2">Welcome Back</h1>
                <p class="text-text-muted">Log in to manage your shortened URLs</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-zinc-400 mb-2">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-indigo-500 text-white rounded-lg py-3 px-4 outline-none transition-all"
                        required
                        data-testid="login-email-input"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-zinc-400 mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        class="w-full bg-zinc-900 border border-zinc-700 focus:border-indigo-500 text-white rounded-lg py-3 px-4 outline-none transition-all"
                        required
                        data-testid="login-password-input"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-3 px-6 rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(99,102,241,0.3)] hover:shadow-[0_0_30px_rgba(99,102,241,0.5)]"
                    data-testid="login-submit-button"
                >
                    Log In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-zinc-400">
                    Don't have an account?
                    <a href="/api/signup" class="text-primary hover:underline" data-testid="signup-link-from-login">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ email, password })
        });
        
        if (!response.ok) {
            const error = await response.json();
            showToast(error.detail || 'Login failed', 'error');
            return;
        }
        
        showToast('Login successful!', 'success');
        setTimeout(() => {
            window.location.href = '/api/dashboard';
        }, 500);
    } catch (error) {
        console.error('Error:', error);
        showToast('Login failed', 'error');
    }
});
</script>
{% endblock %}
