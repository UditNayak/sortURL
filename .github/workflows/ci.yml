name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"                # Enables dependency caching
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run linting (ruff)
        run: |
          ruff check src tests

      - name: Run tests
        env:
          ENV: test
        run: |
          pytest -v --cov=src --cov-report=term-missing
          
          # -------------------------------
          # Coverage Threshold (INTENTIONALLY DISABLED)
          #
          # To enable later, uncomment:
          #
          # pytest -v --cov=src --cov-fail-under=80
          # -------------------------------

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none # Added for Python to skip build attempts

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  sca-dependencies:
    name: SCA (Dependency Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: "shortURL"
          path: "src/requirements.txt"
          format: "HTML"
          args: >
            --enableExperimental
            --out reports

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  container-security:
    name: Container Build & Security Scan
    runs-on: ubuntu-latest
    needs:
      - ci
      - sast-codeql
      - sca-dependencies
      - secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t shorturl:ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shorturl:ci
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Run container
        run: |
          docker run -d -p 8001:8001 --name shorturl-test shorturl:ci
          sleep 5

      - name: Health check
        run: curl -f http://localhost:8001/api/health

      - name: Cleanup
        if: always()
        run: docker rm -f shorturl-test || true
