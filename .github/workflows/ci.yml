name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"                # Enables dependency caching
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run linting (ruff)
        run: |
          ruff check src tests

      - name: Run tests
        env:
          ENV: test
        run: |
          pytest -v --cov=src --cov-report=term-missing
          
          # -------------------------------
          # Coverage Threshold (INTENTIONALLY DISABLED)
          #
          # To enable later, uncomment:
          #
          # pytest -v --cov=src --cov-fail-under=80
          # -------------------------------
