name: CI - Quality, Security & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: shorturl

jobs:
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        env:
          ENV: test
        run: |
          pytest -v --cov=src --cov-report=term-missing
          # pytest -v --cov=src --cov-fail-under=80

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none # Added for Python to skip build attempts

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sca:
    name: SCA (Dependencies Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: shorturl
          path: src/requirements.txt
          format: HTML
          args: >
            --enableExperimental
            --out reports

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history required)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  build-and-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs:
      - quality-tests
      - sast
      - sca
      - secrets-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}

          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .

      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          exit-code: 1
          severity: CRITICAL

      - name: Container Smoke Testing
        run: |
          docker run -d -p 8001:8001 --name shorturl-test \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl -f http://localhost:8001/api/health

      - name: DAST (Nuclei)
        uses: projectdiscovery/nuclei-action@v2
        with:
          target: http://localhost:8001
          severity: critical, high

      - name: Push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}

          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG

      - name: Cleanup
        if: always()
        run: docker rm -f shorturl-test || true
