name: CD - Deploy to AKS

on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]
    types:
      - completed

env:
  AKS_RESOURCE_GROUP: rg-shorturl-aks
  AKS_CLUSTER_NAME: shorturl-aks

jobs:
  deploy:
    name: Deploy (AKS)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/shorturl

      - name: Dummy DAST (Basic Runtime Security Checks)
        run: |
          IP=$(kubectl get svc shorturl-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

          if [ -z "$IP" ]; then
            echo "Service IP not available yet, skipping DAST"
            exit 0
          fi

          echo "Application URL: http://$IP"

          curl -f http://$IP/api/health
