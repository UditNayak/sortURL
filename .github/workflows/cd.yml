name: CD - Deploy to AKS

on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]
    types:
      - completed

env:
  IMAGE_NAME: shorturl

jobs:
  deploy:
    name: Deploy (AKS)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-shorturl-aks
          cluster-name: shorturl-aks

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update image in deployment
        run: |
          kubectl set image deployment/shorturl \
            shorturl=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify rollout
        run: kubectl rollout status deployment/shorturl
