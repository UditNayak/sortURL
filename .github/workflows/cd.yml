name: CD - Deploy to AKS

on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]
    types:
      - completed

env:
  IMAGE_NAME: shorturl

jobs:
  deploy:
    name: Deploy (AKS)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-shorturl-aks
          cluster-name: shorturl-aks

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update image in deployment
        run: |
          kubectl set image deployment/shorturl \
            shorturl=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify rollout
        run: kubectl rollout status deployment/shorturl

      - name: Dummy DAST (Basic Runtime Security Checks)
        run: |
          IP=$(kubectl get svc shorturl-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

          if [ -z "$IP" ]; then
            echo "Service IP not available"
            exit 1
          fi

          curl -f http://$IP/api/health
          curl -I http://$IP | grep -i "content-type" || true
          curl -s http://$IP/../../etc/passwd | grep -i root && exit 1 || true

      - name: Get Service URL
        run: |
          for i in {1..30}; do
            IP=$(kubectl get svc shorturl-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && echo "Application URL: http://$IP" && break
            sleep 10
          done
