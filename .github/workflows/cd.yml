name: CD - DockerHub Push & AKS Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  docker-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/shorturl
          SHA_TAG=sha-${GITHUB_SHA::7}

          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .

      - name: Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/shorturl
          SHA_TAG=sha-${GITHUB_SHA::7}

          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG


  deploy-aks:
    name: Deploy to AKS
    needs: docker-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-shorturl-aks
          cluster-name: shorturl-aks

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update image in deployment
        run: |
          kubectl set image deployment/shorturl \
            shorturl=${{ secrets.DOCKERHUB_USERNAME }}/shorturl:latest

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/shorturl
