apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorturl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shorturl
  template:
    metadata:
      labels:
        app: shorturl
    spec:
      containers:
        - name: shorturl
          # IMPORTANT: Do NOT hardcode DockerHub username
          image: shorturl
          imagePullPolicy: Always

          ports:
            - containerPort: 8001

          env:
            - name: ENV
              value: "production"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
